<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>شكراً لطلبك</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --accent: #d50000;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: "Cairo", Arial, sans-serif;
      background: radial-gradient(circle at top, #1e293b 0%, var(--bg) 60%);
      color: var(--text);
    }

    .card {
      width: min(560px, 100%);
      background: var(--card);
      border-radius: 16px;
      padding: 28px 22px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(2, 6, 23, 0.35);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(24px, 4vw, 34px);
      line-height: 1.3;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.7;
    }

    .btn {
      margin-top: 18px;
      display: inline-block;
      text-decoration: none;
      background: var(--accent);
      color: #fff;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 700;
    }
  </style>
  <!-- Meta Pixel Code -->

</head>
<body>
  <main class="card" aria-label="رسالة تأكيد الطلب">
    <h1>شكراً لك! تم استلام طلبك بنجاح</h1>
    <p>توصلنا بالطلب ديالك وغادي نتواصلو معاك قريباً لتأكيد التفاصيل.</p>
    <a class="btn" href="./index.html">العودة للصفحة الرئيسية</a>
  </main>
</body>
</html>
